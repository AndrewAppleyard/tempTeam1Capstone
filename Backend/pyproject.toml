[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name="Advising"
version="0.0.1"
requires-python = ">=3.13"
description="A package of our projects API files"
authors=[{name="Robert Farrar"}, {name="Christopher Monterozza"}]
dependencies= ["blinker==1.9.0", "certifi>=2025.6.15", "charset-normalizer==3.4.3", "click==8.3.0",
"Flask==3.1.2", "greenlet==3.2.4", "idna==3.10", "itsdangerous==2.2.0", "Jinja2==3.1.6", "MarkupSafe==3.0.3",
"mysql-connector-python==9.4.0", "pip==25.2", "PyMySQL==1.1.2", "requests==2.32.5", "SQLAlchemy==2.0.43",
"SQLAlchemy-Utils==0.42.0", "typing_extensions==4.15.0", "urllib3==2.5.0", "Werkzeug==3.1.3", "psycopg2-binary==2.9.10"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OpenSuse Tumbleweed 15.5"
]

[tool.setuptools]
package-dir = {""="src"}
packages = ["APIs", "UserClasses"]

