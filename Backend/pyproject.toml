[build-system]
requires = ["flit_core>=3.12.0"]
build-backend = "flit_core.buildapi"

[project]
name="Advising"
version="0.0.1"
requires-python = ">=3.13"
description="A package of our projects API files"
authors=[{name="Robert Farrar"}, {name="Christopher Monterozza"}]
dependencies= ["blinker==1.9.0", "certifi>=2025.6.15", "charset-normalizer==3.4.3", "click==8.3.0", "docutils == 0.22.2",
"Flask==3.1.2", "greenlet==3.2.4", "idna==3.10", "itsdangerous==2.2.0", "Jinja2==3.1.6", "MarkupSafe==3.0.3",
"mysql-connector-python==9.4.0", "pip==25.2", "PyMySQL==1.1.2", "requests==2.32.5", "SQLAlchemy==2.0.43",
"SQLAlchemy-Utils==0.42.0", "typing_extensions==4.15.0", "urllib3==2.5.0", "Werkzeug==3.1.3", "psycopg2-binary>=2.9.10",
"cryptography>=46.0.2", "fernet>=1.0.1", "flask-jwt-extended>=3.1.2", "ldap3>=2.9.1", "flask-cors>=6.0.1", "gunicorn>=23.0.0", "selenium>=4.37.0",
"beautifulsoup4>=4.14.2", "webdriver-manager>=4.0.2", "openai>=1.55.0", "python-dotenv>=1.0.1", "pymupdf==1.23.7"]
classifiers = [
    "Programming Language :: Python :: 3"
]

[project.scripts]
Advising = "Advising.wsgi:run"
Advising-dev = "Advising.app:runDev"
Advising-path = "Advising.Aux:findFilePath"
Advising-encrypt = "Advising.Aux:encryptURL"
