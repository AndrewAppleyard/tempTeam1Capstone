services:
  # 389 Directory Server (LDAP)
  dirsrv:
    hostname: uafs
    container_name: uafs_ldap
    build:
      context: .
      dockerfile: Dockerfile-ldap
    ports:
      - "7389:3389"
      - "3636:3636"
    environment:
      DS_DM_PASSWORD: andrewandrew
      DS_SUFFIX_NAME: dc=UAFS,dc=COM
      DS_BACKEND_NAME: uafs
    volumes:
      - ./scripts/datas/initdb.d:/container-entrypoint-initdb.d

  # Vue Frontend
  frontend:
    container_name: uafs_frontend
    build:
      context: .
      dockerfile: Dockerfile-frontend
      target: dev  # dev for dev server, builder for prod 
    ports:
      - "5173:5173" # "8080:80" for apache prod?
    depends_on:
      - backend

  # PostgreSQL Database
  db:
    container_name: uafs_postgres
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./Backend/postgres.sh:/docker-entrypoint-initdb.d/postgres.sh
      - ./Backend/database.sql:/docker-entrypoint-initdb.d/database.sql
    ports:
      - "5433:5432"

  # Flask Backend
  backend:
    container_name: uafs_backend
    build:
      context: .
      dockerfile: Dockerfile-api
    ports:
      - "5000:5000"
    depends_on:
      - db

volumes:
  pgdata:
