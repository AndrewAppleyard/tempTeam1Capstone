<VirtualHost *:80>
    DocumentRoot /usr/local/apache2/htdocs

    ProxyPreserveHost On

    ProxyPass "/Admin/" "http://uafs_backend:5000/Admin/"
    ProxyPassReverse "/Admin/" "http://uafs_backend:5000/Admin/"

    ProxyPass "/Advisor/" "http://uafs_backend:5000/Advisor/"
    ProxyPassReverse "/Advisor/" "http://uafs_backend:5000/Advisor/"

    ProxyPass "/Student/" "http://uafs_backend:5000/Student/"
    ProxyPassReverse "/Student/" "http://uafs_backend:5000/Student/"

    <Directory /usr/local/apache2/htdocs>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>